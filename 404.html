<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="This page has been taken by The Others. It will not answer your name any more. It answers to the cold now."
    />

    <link
      rel="preload"
      href="/fonts/cinzel-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cardo-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>404</title>
  </head>
  <body class="not-found-body">
    <canvas id="snow" aria-hidden="true"></canvas>

    <main class="not-found">
      <section class="nf-hero" aria-labelledby="nf-title">
        <svg class="nf-flake" viewBox="0 0 100 100" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path id="nf-arm" d="M50 50 V12 M50 24 l-7 7 M50 24 l7 7 M50 38 l-5 5 M50 38 l5 5" />
            <use href="#nf-arm" transform="rotate(60 50 50)" />
            <use href="#nf-arm" transform="rotate(120 50 50)" />
            <use href="#nf-arm" transform="rotate(180 50 50)" />
            <use href="#nf-arm" transform="rotate(240 50 50)" />
            <use href="#nf-arm" transform="rotate(300 50 50)" />
            <circle cx="50" cy="50" r="3.5" fill="currentColor" stroke="none" />
          </g>
        </svg>

        <p class="nf-sr">Error 404: page not found.</p>

        <h1 id="nf-title" class="nf-title">
          <span class="nf-title-lead">This page has been taken by</span>
          <span class="nf-others">The Others</span>
          <span class="nf-title-sub">It will not answer your name any more. It answers to the cold now.</span>
        </h1>

        <div class="nf-actions">
          <a class="nf-btn" id="nf-home" href="/">Return to the Wall</a>
        </div>
      </section>
    </main>

    <script src="/404.js"></script>
  </body>
</html>

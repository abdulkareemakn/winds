<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <title>Winds of Winter Countdown</title>
  </head>
  <body>
    <div class="title-row">
    <div class="headline">Winter is Coming</div>
    <div class="question">(or is it?)</div>
    </div>

    <div id="counter">
      <span class="open">It has been</span>

      <span id="days"></span>
      <span id="days_counter"></span>,
      <span id="hours"></span>
      <span id="hours_counter"></span>,
      <span id="minutes"></span>
      <span id="minutes_counter"></span>
      and
      <span id="seconds"></span>
      <span id="seconds_counter"></span>

      <span class="close">
        since <strong>A Dance with Dragons</strong> was released.</span
      >
    </div>
    <script src="script.js"></script>
  </body>
</html>

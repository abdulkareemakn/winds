<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="How long has it been since A Dance with Dragons was published? A live countdown of the wait for The Winds of Winter."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Winds of Winter Countdown</title>
  </head>
  <body>
    <main>
      <div class="title-row">
        <div class="headline">Winter is Coming</div>
        <div class="question">(or is it?)</div>
      </div>

      <div id="counter">
        <span class="open">It has been</span>

        <span id="days"></span>
        <span id="days_counter"></span>,
        <span id="hours"></span>
        <span id="hours_counter"></span>,
        <span id="minutes"></span>
        <span id="minutes_counter"></span>
        and
        <span id="seconds"></span>
        <span id="seconds_counter"></span>

        <span class="close">
          since <strong>A Dance with Dragons</strong> was published.</span
        >
      </div>

    </main>

    <script src="script.js"></script>
  </body>
</html>
